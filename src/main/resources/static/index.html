<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Artículos</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f4f5f7;
            color: #222;
            margin: 0;
            padding: 40px 16px;
        }
        .contenedor { max-width: 760px; margin: 0 auto; }
        h1 { margin: 0 0 4px; font-size: 28px; }
        .subtitulo { color: #666; margin: 0 0 28px; }
        .tarjeta {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
        }
        h2 { margin: 0 0 16px; font-size: 18px; }
        form { display: flex; gap: 10px; flex-wrap: wrap; }
        input {
            flex: 1;
            min-width: 160px;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-principal { background: #2563eb; color: #fff; }
        .btn-principal:hover { background: #1d4ed8; }
        .btn-secundario { background: #e5e7eb; color: #222; }
        .btn-editar { background: #f59e0b; color: #fff; padding: 6px 12px; }
        .btn-eliminar { background: #dc2626; color: #fff; padding: 6px 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        th { color: #555; font-size: 14px; }
        .acciones { display: flex; gap: 6px; }
        .vacio { color: #888; text-align: center; padding: 20px; }
        #mensaje { min-height: 20px; margin-top: 12px; font-size: 14px; }
        .ok { color: #16a34a; }
        .error { color: #dc2626; }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>Gestión de Artículos</h1>
    <p class="subtitulo">Santino Toso · Backend Java · Comisión 26223</p>

    <div class="tarjeta">
        <h2 id="titulo-form">Nuevo artículo</h2>
        <form id="form-articulo">
            <input type="hidden" id="id">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="number" id="precio" placeholder="Precio" min="0" step="0.01" required>
            <button type="submit" class="btn-principal" id="btn-guardar">Guardar</button>
            <button type="button" class="btn-secundario" id="btn-cancelar" hidden>Cancelar</button>
        </form>
        <div id="mensaje"></div>
    </div>

    <div class="tarjeta">
        <h2>Listado</h2>
        <table>
            <thead>
            <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tabla-articulos"></tbody>
        </table>
    </div>
</div>

<script>
    const API = "http://localhost:8080/api/articulos";

    const form = document.getElementById("form-articulo");
    const inputId = document.getElementById("id");
    const inputNombre = document.getElementById("nombre");
    const inputPrecio = document.getElementById("precio");
    const tituloForm = document.getElementById("titulo-form");
    const btnCancelar = document.getElementById("btn-cancelar");
    const tabla = document.getElementById("tabla-articulos");
    const mensaje = document.getElementById("mensaje");

    function mostrarMensaje(texto, tipo) {
        mensaje.textContent = texto;
        mensaje.className = tipo;
        setTimeout(() => { mensaje.textContent = ""; }, 3000);
    }

    function formatearPrecio(precio) {
        return "$" + Number(precio).toLocaleString("es-AR", { minimumFractionDigits: 2 });
    }

    async function cargarArticulos() {
        try {
            const respuesta = await fetch(API);
            const articulos = await respuesta.json();
            tabla.innerHTML = "";

            if (articulos.length === 0) {
                tabla.innerHTML = '<tr><td colspan="4" class="vacio">No hay artículos cargados</td></tr>';
                return;
            }

            articulos.forEach(articulo => {
                const fila = document.createElement("tr");
                fila.innerHTML = `
                    <td>${articulo.id}</td>
                    <td></td>
                    <td>${formatearPrecio(articulo.precio)}</td>
                    <td>
                        <div class="acciones">
                            <button class="btn-editar">Editar</button>
                            <button class="btn-eliminar">Eliminar</button>
                        </div>
                    </td>`;
                fila.children[1].textContent = articulo.nombre;
                fila.querySelector(".btn-editar").addEventListener("click", () => editarArticulo(articulo));
                fila.querySelector(".btn-eliminar").addEventListener("click", () => eliminarArticulo(articulo.id));
                tabla.appendChild(fila);
            });
        } catch (e) {
            tabla.innerHTML = '<tr><td colspan="4" class="vacio error">No se pudo conectar con la API</td></tr>';
        }
    }

    form.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const articulo = {
            nombre: inputNombre.value.trim(),
            precio: parseFloat(inputPrecio.value)
        };

        const id = inputId.value;
        const url = id ? `${API}/${id}` : API;
        const metodo = id ? "PUT" : "POST";

        const respuesta = await fetch(url, {
            method: metodo,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(articulo)
        });

        if (respuesta.ok) {
            mostrarMensaje(id ? "Artículo modificado" : "Artículo creado", "ok");
            limpiarFormulario();
            cargarArticulos();
        } else {
            mostrarMensaje("Error al guardar el artículo", "error");
        }
    });

    function editarArticulo(articulo) {
        inputId.value = articulo.id;
        inputNombre.value = articulo.nombre;
        inputPrecio.value = articulo.precio;
        tituloForm.textContent = "Editar artículo #" + articulo.id;
        btnCancelar.hidden = false;
        inputNombre.focus();
    }

    async function eliminarArticulo(id) {
        if (!confirm("¿Eliminar el artículo #" + id + "?")) return;

        const respuesta = await fetch(`${API}/${id}`, { method: "DELETE" });

        if (respuesta.ok) {
            mostrarMensaje("Artículo eliminado", "ok");
            cargarArticulos();
        } else {
            mostrarMensaje("Error al eliminar el artículo", "error");
        }
    }

    function limpiarFormulario() {
        form.reset();
        inputId.value = "";
        tituloForm.textContent = "Nuevo artículo";
        btnCancelar.hidden = true;
    }

    btnCancelar.addEventListener("click", limpiarFormulario);

    cargarArticulos();
</script>
</body>
</html>
